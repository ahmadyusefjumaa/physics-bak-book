rect": 1}, "why": "الدور يتناسب عكسيًا مع الجذر التربيعي لثابت الفتل؛ السلك الأشد صلابة يعيد الجسم أسرع فيقصر الدور.", "scene": "torsion", "sceneDescription": "قرص على سلك فتل يلتوي ثم يتذبذب، مع إظهار العزم واتجاهه."}, {"id": 3, "unit": "الحركة والتحريك", "title": "الاهتزازات غير التوافقية: النواس الثقلي غير المتخامد", "summary": "يتأرجح النواس الثقلي حول وضع توازنه بفعل مركبة وزن الجسم. عند السعات الزاوية الصغيرة يمكن تقريب حركته بحركة توافقية بسيطة.", "formula": "T=2π√(ℓ/g)  (للنواس البسيط والسعات الصغيرة)", "vocabulary": [["النواس الثقلي", "جسم يتأرجح حول محور ثابت بفعل الثقل."], ["النواس البسيط", "كتلة نقطية معلقة بخيط خفيف."], ["السعة الزاوية", "أكبر زاوية عن وضع التوازن."], ["مركز الثقل", "موضع تأثير وزن الجسم."]], "quiz": {"q": "إذا ضاعفنا طول خيط النواس البسيط، كيف يتغير دوره؟", "options": ["يتضاعف", "يزداد بمقدار √2", "ينخفض إلى النصف"], "correct": 1}, "why": "الدور يتناسب مع الجذر التربيعي للطول، لذلك مضاعفة الطول تضرب الدور بـ√2 لا باثنين.", "scene": "pendulum", "sceneDescription": "نواس يتأرجح مع قوس زاوي ومؤشر للطاقة الكامنة والحركية."}, {"id": 4, "unit": "الحركة والتحريك", "title": "ميكانيك السوائل المتحركة", "summary": "يصف هذا الدرس الجريان المنتظم وغير المنتظم للسائل المثالي ومعدل تدفقه. تربط معادلة الاستمرارية بين مساحة المقطع وسرعة الجريان، وتربط برنولي الضغط والسرعة والارتفاع.", "formula": "Q=Av  ·  A₁v₁=A₂v₂  ·  P+½ρv²+ρgh= ثابت", "vocabulary": [["خط الانسياب", "منحنى مماسه يوافق اتجاه سرعة السائل."], ["معدل التدفق", "حجم السائل المار في وحدة الزمن."], ["السائل المثالي", "سائل غير قابل للانضغاط وعديم اللزوجة في النموذج."], ["معادلة برنولي", "علاقة حفظ الطاقة على خط انسياب."]], "quiz": {"q": "عندما يضيق الأنبوب في جريان مستقر لسائل غير قابل للانضغاط، ماذا يحدث للسرعة؟", "options": ["تزداد", "تنقص", "تبقى ثابتة"], "correct": 0}, "why": "من معادلة الاستمرارية يبقى حاصل A×v ثابتًا؛ لذلك تزداد السرعة عندما تصغر مساحة المقطع.", "scene": "fluid", "sceneDescription": "أنبوب متغير المقطع تتدفق خلاله جسيمات، مع مقياسي سرعة وضغط."}, {"id": 5, "unit": "الحركة والتحريك", "title": "النسبية الخاصة", "summary": "تبحث النسبية الخاصة في قياس الزمن والطول والطاقة عند السرعات الكبيرة. تعتمد على ثبات سرعة الضوء في الخلاء ومبدأ تكافؤ قوانين الفيزياء في الجمل العطالية.", "formula": "γ=1/√(1−v²/c²)  ·  Δt=γΔt₀  ·  L=L₀/γ  ·  E₀=mc²", "vocabulary": [["جملة المقارنة", "الإطار الذي تقاس بالنسبة إليه الحركة."], ["تمدد الزمن", "ازدياد الزمن المقاس لجسم متحرك بالنسبة للراصد."], ["تقلص الأطوال", "نقصان الطول الموازي للحركة في القياس النسبي."], ["طاقة السكون", "الطاقة المكافئة لكتلة الجسم في السكون."]], "quiz": {"q": "عند الاقتراب من سرعة الضوء، ماذا يحدث للزمن المقاس من راصد خارجي؟", "options": ["يتمدد", "يتقلص", "لا يتغير"], "correct": 0}, "why": "عامل لورنتز γ أكبر من الواحد ويزداد مع السرعة؛ لذلك يكون الزمن المقاس Δt أكبر من الزمن الخاص Δt₀.", "scene": "relativity", "sceneDescription": "ساعة ضوئية ومساران ضوئيان يوضحان اختلاف الزمن مع السرعة."}, {"id": 6, "unit": "الكهرباء والمغناطيسية", "title": "المغناطيسية", "summary": "ينشأ الحقل المغناطيسي حول المغناطيسات والتيارات الكهربائية، ويوصف بشعاع واتجاه وشدة. يدرس الدرس النفاذية والتدفق المغناطيسي والحقل المغناطيسي الأرضي.", "formula": "B=μH  ·  Φ=B A cosθ", "vocabulary": [["الحقل المغناطيسي B", "كمية شعاعية تصف التأثير المغناطيسي."], ["النفاذية μ", "خاصية الوسط المؤثرة في الحقل."], ["التدفق Φ", "مقدار الحقل المار عبر سطح."], ["خطوط الحقل", "منحنيات تمثل اتجاه الحقل المغناطيسي."]], "quiz": {"q": "أين تكون خطوط الحقل حول مغناطيس قضيب أكثر تقاربًا؟", "options": ["قرب القطبين", "في منتصف المسافة بعيدًا عنه", "لا تتقارب أبدًا"], "correct": 0}, "why": "تقارب خطوط الحقل يدل على شدة أكبر، وتكون الشدة قرب قطبي المغناطيس أكبر عادةً.", "scene": "magnet", "sceneDescription": "مغناطيس قضيب وخطوط حقل وبوصلة تتجه مع المجال."}, {"id": 7, "unit": "الكهرباء والمغناطيسية", "title": "فعل الحقل المغناطيسي في التيار الكهربائي", "summary": "يؤثر الحقل المغناطيسي بقوة في شحنة متحركة أو ناقل يمر فيه تيار. يتحدد اتجاه القوة وفق اتجاه الحركة أو التيار والحقل المغناطيسي.", "formula": "F=|q|vB sinθ  ·  F=BIL sinθ", "vocabulary": [["قوة لورنز", "القوة المغناطيسية المؤثرة في شحنة متحركة."], ["التيار الكهربائي", "معدل تدفق الشحنة عبر مقطع."], ["الناقل", "موصل يمر فيه تيار كهربائي."], ["منتقي السرعات", "جهاز ينتقي جسيمات ذات سرعة محددة."]], "quiz": {"q": "متى تنعدم القوة المغناطيسية على شحنة متحركة؟", "options": ["عندما تتحرك موازية للحقل", "عندما تتحرك عمودية للحقل", "عندما تزيد سرعتها"], "correct": 0}, "why": "القوة تتناسب مع sinθ؛ فإذا كانت الحركة موازية للحقل كانت θ=0 وبالتالي القوة معدومة.", "scene": "lorentz", "sceneDescription": "جسيم مشحون ينحرف في حقل مغناطيسي مع أسهم السرعة والقوة."}, {"id": 8, "unit": "الكهرباء والمغناطيسية", "title": "التحريض الكهرطيسي", "summary": "يتولد تيار كهربائي متحرض عندما يتغير التدفق المغناطيسي عبر دارة. يوضح الدرس قانوني فاراداي ولنز والتحريض الذاتي والطاقة المختزنة في الوشيعة.", "formula": "ε=−dΦ/dt  ·  ε=−L(di/dt)  ·  E=½LI²", "vocabulary": [["التحريض الكهرطيسي", "توليد قوة محركة كهربائية بتغير التدفق."], ["التيار المتحرض", "تيار ينشأ نتيجة التحريض."], ["قانون لنز", "اتجاه التيار يعاكس سبب نشوئه."], ["التحريض الذاتي", "تولد قوة محركة في الدارة بسبب تغير تيارها."]], "quiz": {"q": "إذا توقف تغير التدفق المغناطيسي، ماذا يحدث للقوة المحركة المتحرضة؟", "options": ["تصبح معدومة", "تزداد", "تنعكس دائمًا"], "correct": 0}, "why": "قانون فاراداي يربط القوة المحركة بمعدل تغير التدفق؛ إذا كان dΦ/dt=0 تصبح ε=0.", "scene": "induction", "sceneDescription": "مغناطيس يتحرك داخل وشيعة ويضيء مصباحًا بحسب سرعة الحركة."}, {"id": 9, "unit": "الكهرباء والمغناطيسية", "title": "الاهتزازات الكهربائية الحرة والدوائر المهتزة والتيارات عالية التواتر", "summary": "تتبادل الدارة المهتزة الطاقة بين المكثفة والوشيعة أثناء التفريغ الكهربائي. تحدد سعة العناصر دور الاهتزاز وتواتره، ويعرض الدرس التيارات عالية التواتر وتطبيقاتها.", "formula": "T=2π√(LC)  ·  f=1/(2π√(LC))", "vocabulary": [["دارة مهتزة", "دارة تضم مكثفة ووشيعة وتتبادل الطاقة."], ["التفريغ المهتز", "تغير دوري للتيار والشحنة في دارة LC."], ["الدور", "زمن اهتزازة كاملة."], ["التواتر", "عدد الاهتزازات في الثانية."]], "quiz": {"q": "إذا زادت سعة المكثفة C وبقي L ثابتًا، ماذا يحدث لدور دارة LC؟", "options": ["يزداد", "ينقص", "لا يتغير"], "correct": 0}, "why": "الدور يتناسب مع الجذر التربيعي لـC؛ زيادة السعة تجعل التذبذب أبطأ.", "scene": "lc", "sceneDescription": "مكثفة ووشيعة مع شحنات تتنقل بينهما وموجة جيبية."}, {"id": 10, "unit": "الكهرباء والمغناطيسية", "title": "التيار المتناوب الجيبي", "summary": "يتغير التيار والتوتر المتناوبان جيبيًا مع الزمن، ويصفهما التوتر الأعظمي والفعال والتواتر والطور. يدرس الدرس الاستطاعة والدارة المتناوبة والرنين الكهربائي.", "formula": "u=Umax sin(ωt)  ·  Ieff=Imax/√2  ·  P=UI cosφ", "vocabulary": [["القيمة الفعالة", "قيمة مستمرة مكافئة في الأثر الحراري."], ["الطور", "الزاوية التي تحدد حالة الاهتزاز."], ["عامل الاستطاعة", "cosφ ويحدد نسبة الاستطاعة الفعالة."], ["الرنين الكهربائي", "حالة توافق تواتر المنبع مع تواتر الدارة."]], "quiz": {"q": "القيمة الفعالة لتيار جيبي تساوي؟", "options": ["Imax", "Imax/√2", "√2 Imax"], "correct": 1}, "why": "لتيار جيبي، القيمة الفعالة هي الجذر التربيعي لمتوسط مربع التيار، وتساوي القيمة العظمى مقسومة على √2.", "scene": "ac", "sceneDescription": "موجة جيبية ومؤشر تيار متناوب يتبدل اتجاهه."}, {"id": 11, "unit": "الكهرباء والمغناطيسية", "title": "المحوّلات الكهربائية", "summary": "يعمل المحول بالتحريض المتبادل بين وشيعتين على قلب حديدي. يرفع التوتر أو يخفضه بحسب نسبة عدد اللفات، مع وجود ضياعات تحدد المردود.", "formula": "Vs/Vp=Ns/Np  ·  η=Pout/Pin", "vocabulary": [["المحوّل", "جهاز يغير قيمة التوتر المتناوب."], ["الوشيعة الابتدائية", "الملف الموصول بالمنبع."], ["الوشيعة الثانوية", "الملف الذي يستقبل الطاقة المحولة."], ["المردود", "نسبة الاستطاعة الخارجة إلى الداخلة."]], "quiz": {"q": "في محول مثالي، إذا كان عدد لفات الثانوي أكبر من الابتدائي، فهو؟", "options": ["رافع للتوتر", "خافض للتوتر", "لا يغير التوتر"], "correct": 0}, "why": "نسبة التوتر تساوي نسبة عدد اللفات؛ زيادة لفات الثانوي ترفع توتره مقارنة بالابتدائي.", "scene": "transformer", "sceneDescription": "قلب حديدي وملفان مع تدفق مغناطيسي متغير ومؤشر جهد."}, {"id": 12, "unit": "الأمواج المستقرة", "title": "الأمواج المستقرة العرضية", "summary": "تنشأ الموجة المستقرة من تراكب موجتين متعاكستين متماثلتين. تظهر عقد لا تهتز وبطون تبلغ عندها سعة الاهتزاز قيمة عظمى.", "formula": "y=2A sin(kx) cos(ωt)  ·  L=nλ/2 (وتر مثبت الطرفين)", "vocabulary": [["العقدة", "نقطة سعتها معدومة."], ["البطن", "نقطة سعتها أعظمية."], ["التجاوب", "اهتزاز بسعة كبيرة عند توافق التواتر."], ["التواتر الأساسي", "أصغر تواتر طبيعي للاهتزاز."]], "quiz": {"q": "أي نقطة في الموجة المستقرة تبقى ساكنة؟", "options": ["البطن", "العقدة", "كل النقاط"], "correct": 1}, "why": "العقدة موضع تداخل هدّام دائم، لذلك تكون سعة الاهتزاز فيها صفرًا.", "scene": "standingTransverse", "sceneDescription": "وتر يهتز مكونًا عقدًا وبطونًا مع تلوين السعة."}, {"id": 13, "unit": "الأمواج المستقرة", "title": "الأمواج المستقرة الطولية", "summary": "تظهر الموجات المستقرة الطولية في الهواء داخل الأعمدة الهوائية على شكل مناطق تضاغط وتخلخل. تتحدد التواترات الطبيعية بشروط طرفي المزمار وطوله.", "formula": "v=fλ  ·  fₙ=nv/(2L) (طرفان متماثلان)  ·  fₙ=(2n−1)v/(4L) (طرفان مختلفان)", "vocabulary": [["التضاغط", "منطقة تتقارب فيها جزيئات الوسط."], ["التخلخل", "منطقة تتباعد فيها جزيئات الوسط."], ["المزمار", "عمود هوائي يهتز ويصدر صوتًا."], ["الموجة الطولية", "اهتزاز جزيئات الوسط موازٍ لاتجاه الانتشار."]], "quiz": {"q": "في موجة طولية مستقرة، ما الذي يتناوب على طول الوسط؟", "options": ["عقد وبطون عرضية", "تضاغطات وتخلخلات", "قمم وقيعان سطحية"], "correct": 1}, "why": "الاهتزاز الطولي يسبب مناطق تتقارب فيها الجزيئات وأخرى تتباعد، فتتشكل التضاغطات والتخلخلات.", "scene": "standingLongitudinal", "sceneDescription": "أنبوب هوائي مع جسيمات تتحرك طوليًا وتظهر مناطق التضاغط والتخلخل."}, {"id": 14, "unit": "الإلكترونيات والجسم الصلب", "title": "النماذج الذرية والطيوف", "summary": "يعرض الدرس نموذج بور ومستويات الطاقة المكممة في ذرة الهيدروجين. انتقال الإلكترون بين المستويات يرتبط بامتصاص أو إصدار فوتون، وتكشف الأطياف عن بنية الذرات.", "formula": "Eₙ=−13.6/n² eV  ·  |ΔE|=hf=hc/λ", "vocabulary": [["التكميم", "امتلاك ا  else if(type==='lc'){addMesh(new THREE.BoxGeometry(.7,.8,.18),glow,[-1,.55,0],[1,1,1],'المكثفة');addMesh(new THREE.CylinderGeometry(.35,.35,.65,24),teal,[1,.55,0],[1,1,1],'الوشيعة');line([[-.65,.55,0],[.4,.55,0]],'#25231f',.03);line([[1.35,.55,0],[1.6,.55,0],[-1.35,.55,0],[-1.35,.55,0]],'#25231f',.03)}
 else if(type==='ac'){line([[-1.8,.7,0],[-1.3,1.2,0],[-.8,.7,0],[-.3,.2,0],[.2,.7,0],[.7,1.2,0],[1.2,.7,0],[1.7,.2,0]],'#168c8d',.04);addMesh(new THREE.CylinderGeometry(.32,.32,.15,32),glow,[0,.35,.6],[1,1,1],'مؤشر التيار');addMesh(new THREE.BoxGeometry(.5,.5,.5),ink,[-1.3,.5,-.7],[1,1,1],'المولد')}
 else if(type==='transformer'){addMesh(new THREE.BoxGeometry(1.1,1.1,.35),mat('#b9a77f'),[0,.7,0],[1,1,1],'القلب الحديدي');for(let i=0;i<5;i++){line([[-1.1,.35+i*.16,.15],[-.85,.35+i*.16,.15],[-.85,.35+i*.16,.15]],'#168c8d',.04);line([[.85,.35+i*.16,.15],[1.1,.35+i*.16,.15]],'#b48b2d',.04)}addMesh(new THREE.BoxGeometry(.25,.85,.45),teal,[-1.15,.7,0],[1,1,1],'الابتدائي');addMesh(new THREE.BoxGeometry(.25,.85,.45),glow,[1.15,.7,0],[1,1,1],'الثانوي')}
 else if(type==='standingTransverse'){line(Array.from({length:50},(_,i)=>[-2+i*4/49,.55+Math.sin(i/49*Math.PI*4)*.7,0]),'#168c8d',.035);for(let x of [-1,0,1])addMesh(new THREE.CylinderGeometry(.06,.06,.7,12),glow,[x,.55,0],[1,1,1],'عقدة أو بطن')}
 else if(type==='standingLongitudinal'){for(let i=0;i<22;i++){let x=-1.8+i*.17;addMesh(new THREE.SphereGeometry(.07,12,10),i%5<2?glow:teal,[x,.55,0],[1,1,1],'جزيء الوسط')}}
 else if(type==='atom'){addMesh(new THREE.SphereGeometry(.3,24,20),glow,[0,.65,0],[1,1,1],'النواة');for(let r of [.8,1.25,1.65]){const tor=new THREE.Mesh(new THREE.TorusGeometry(r,.018,6,90),ink);tor.rotation.x=Math.PI/2;tor.position.y=.65;popRoot.add(tor)}addMesh(new THREE.SphereGeometry(.14,18,16),teal,[1.25,.65,0],[1,1,1],'الإلكترون')}
 else if(type==='electron'){addMesh(new THREE.BoxGeometry(3,.12,1.5),mat('#ddd2bc'),[0,.25,0]);addMesh(new THREE.SphereGeometry(.15,18,16),glow,[-1.3,.65,0],[1,1,1],'الإلكترون');addMesh(new THREE.BoxGeometry(.18,.75,1.2),teal,[1,.65,0],[1,1,1],'اللوح');line([[-1.2,.65,0],[0,.65,.6],[1,.65,.6]],'#168c8d',.03)}
 else if(type==='discharge'){addMesh(new THREE.CylinderGeometry(.55,.55,2.7,32,1,true),paper,[0,.8,0],[1,1,1],'أنبوب التفريغ');addMesh(new THREE.SphereGeometry(.18,18,16),glow,[-.95,.8,0],[1,1,1],'المهبط');addMesh(new THREE.SphereGeometry(.18,18,16),teal,[.95,.8,0],[1,1,1],'المصعد');line([[-.8,.8,0],[0,.8,.12],[.8,.8,0]],'#e7b34a',.05)}
 else if(type==='oscilloscope'){addMesh(new THREE.BoxGeometry(2.7,1.5,.2),ink,[0,.8,0]);addMesh(new THREE.PlaneGeometry(2.25,1.05),mat('#c8e3d2'),[0,.82,.12]);line(Array.from({length:50},(_,i)=>[-1.05+i*2.1/49,.82+Math.sin(i/49*Math.PI*6)*.38,.15]),'#168c8d',.025);addMesh(new THREE.CylinderGeometry(.1,.1,.25,16),glow,[-1.1,.3,.2],[1,1,1],'مقبض التحكم')}
 else if(type==='photoelectric'){addMesh(new THREE.BoxGeometry(1.6,.12,1.2),ink,[.3,.35,0],[1,1,1],'سطح المعدن');line([[-1.8,1.8,0],[-.8,.65,0]],'#b48b2d',.05);for(let i=0;i<5;i++)addMesh(new THREE.SphereGeometry(.08,12,10),glow,[.55+i*.28,.8+(i%2)*.2,0],[1,1,1],'إلكترون منبعث');addMesh(new THREE.ConeGeometry(.12,.35,12),teal,[-1,.9,0],[1,1,1],'فوتون')}
 else if(type==='xray'){addMesh(new THREE.CylinderGeometry(.3,.3,.9,24),ink,[-1.5,.9,0],[1,1,1],'أنبوب الأشعة');line([[-1.2,.9,0],[0,.9,0],[1.5,.9,0]],'#b48b2d',.045);addMesh(new THREE.BoxGeometry(.45,1.25,.5),paper,[.1,.8,0],[1,1,1],'عينة');addMesh(new THREE.BoxGeometry(.2,1.3,.65),teal,[1.5,.8,0],[1,1,1],'كاشف')}
 else if(type==='laser'){addMesh(new THREE.BoxGeometry(2.2,.75,.75),mat('#b6a47b'),[0,.65,0],[1,1,1],'الوسط الفعال');addMesh(new THREE.CylinderGeometry(.48,.48,.12,32),glow,[-1.3,.65,0],[1,1,1],'مرآة');addMesh(new THREE.CylinderGeometry(.48,.48,.12,32),teal,[1.3,.65,0],[1,1,1],'مرآة جزئية');line([[0,.65,0],[2,.65,0]],'#e2bd53',.055)}
 else if(type==='galaxy'){const g=new THREE.Group();popRoot.add(g);for(let i=0;i<240;i++){let a=i*.23,r=.12+i/240*1.8;let s=new THREE.Mesh(new THREE.SphereGeometry(.025+(i%4)*.006,6,6),i%5===0?glow:paper);s.position.set(Math.cos(a)*r,.6+Math.sin(i)*.08,Math.sin(a)*r*.65);g.add(s)}addMesh(new THREE.SphereGeometry(.22,18,16),glow,[0,.65,0],[1,1,1],'مركز المجرة');line([[-1.7,.6,0],[1.7,.6,0]],'#168c8d',.02)}
 // pop-up ink outline approximation: dark wireframe overlays on selected shapes
 popRoot.scale.setScalar(.01);gsap.to(popRoot.scale,{x:1,y:1,z:1,duration:.75,ease:'back.out(1.5)'});
}
function renderLesson(){const l=LESSONS[lessonIndex];quizChosen=false;document.querySelector('#progress').textContent=`SPREAD ${String(lessonIndex+1).padStart(2,'0')} / ${LESSONS.length} · ${l.unit}`;
document.querySelector('#lessonName').textContent=l.title;
leftEl.innerHTML=`<div class="kicker">PHYSICS · ${String(l.id).padStart(2,'0')} / ${l.unit}</div><h1>${l.title}</h1><p class="summary">${l.summary}</p><div class="formula">${l.formula}</div><div class="section-title">مفردات أساسية</div><div class="vocab">${l.vocabulary.map(v=>`<div><b>${v[0]}</b><br>${v[1]}</div>`).join('')}</div><div class="section-title">توقّع قبل التجربة</div><div class="quiz"><b>${l.quiz.q}</b><div class="answers">${l.quiz.options.map((a,i)=>`<button class="answer" data-answer="${i}">${['أ','ب','ج'][i]}. ${a}</button>`).join('')}</div></div><div class="flap-wrap"><div class="flap" id="flap"><div class="flap-front"><b>ارفع الغطاء بعد اختيار إجابتك</b><span>لماذا؟　↗</span></div><div class="flap-back">${l.why}</div></div></div><div class="stamp" id="stamp">لم يكتمل<br>الدرس</div>`;
leftEl.querySelectorAll('.answer').forEach(btn=>btn.addEventListener('click',()=>{if(quizChosen)return;quizChosen=true;const n=+btn.dataset.answer;leftEl.querySelectorAll('.answer').forEach((b,i)=>{if(i===l.quiz.correct)b.classList.add('correct');else if(i===n)b.classList.add('wrong')});leftEl.querySelector('#flap').classList.add('open');toast(n===l.quiz.correct?'توقّع صحيح':'جرّب فهم السبب من الشرح');}));
buildScene(l);updateStamp();document.querySelector('#caption').style.opacity=0;
}
function updateStamp(){const stamp=leftEl.querySelector('#stamp');if(!stamp)return;const done=clickable.length>0&&clickable.every((m,i)=>interacted.has(m.uuid));stamp.classList.toggle('done',done);stamp.innerHTML=done?'✓<br>مكتمل':'لم يكتمل<br>الدرس'}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.style.opacity=1;setTimeout(()=>el.style.opacity=0,1700)}
function stopDemo(){if(playing){playing=false;gsap.killTweensOf(camera.position);gsap.killTweensOf(controls.target);controls.enabled=true;document.querySelector('#play').textContent='▶';document.querySelector('#caption').style.opacity=0}}
controls.addEventListener('start',()=>{if(playing)stopDemo()});
let pointerDown=null;
renderer.domElement.addEventListener('pointerdown',e=>{pointerDown={x:e.clientX,y:e.clientY,button:e.button}});
renderer.domElement.addEventListener('pointerup',e=>{if(!pointerDown)return;const d=Math.hypot(e.clientX-pointerDown.x,e.clientY-pointerDown.y);if(d<5&&e.button===0){pointer.x=(e.clientX/innerWidth)*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(clickable,true);if(hits.length){let obj=hits[0].object;while(obj.parent&&obj.parent!==popRoot)obj=obj.parent;interacted.add(obj.uuid);gsap.to(obj.scale,{x:1.2,y:1.2,z:1.2,duration:.16,yoyo:true,repeat:1});obj.material?.emissive && (obj.material.emissiveIntensity=1.1);updateStamp();if(soundOn)beep();toast('تم تفعيل العنصر: '+(obj.userData.part||'رسم تفاعلي'));}}pointerDown=null});
function beep(){try{const ac=new AudioContext(),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=660;g.gain.value=.035;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.08)}catch(e){}}
function turn(dir){if(animating)return;stopDemo();animating=true;controls.enabled=false;gsap.to(rightPageGroup.rotation,{y:dir>0?-Math.PI*.8:Math.PI*.8,duration:.34,ease:'power2.in',onComplete:()=>{lessonIndex=(lessonIndex+dir+LESSONS.length)%LESSONS.length;renderLesson();rightPageGroup.rotation.y=dir>0?Math.PI*.8:-Math.PI*.8;gsap.to(rightPageGroup.rotation,{y:0,duration:.5,ease:'power2.out',onComplete:()=>{animating=false;controls.enabled=true}})}})}
document.querySelector('#next').onclick=()=>turn(1);document.querySelector('#prev').onclick=()=>turn(-1);
document.querySelector('#tocBtn').onclick=()=>document.querySelector('#toc').classList.toggle('open');
document.querySelector('#tocItems').innerHTML=LESSONS.map((l,i)=>`<button data-i="${i}">${String(i+1).padStart(2,'0')} · ${l.title}</button>`).join('');
document.querySelectorAll('#tocItems button').forEach(b=>b.onclick=()=>{const target=+b.dataset.i;lessonIndex=target;document.querySelector('#toc').classList.remove('open');renderLesson()});
document.querySelector('#reset').onclick=()=>{stopDemo();if(reduceMotion){camera.position.set(0,9.7,10.8);controls.target.set(0,.25,0);controls.update()}else{gsap.to(camera.position,{x:0,y:9.7,z:10.8,duration:.8,ease:'power2.inOut'});gsap.to(controls.target,{x:0,y:.25,z:0,duration:.8,ease:'power2.inOut'})}};
document.querySelector('#sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.style.background=soundOn?'#167f79':'#ffffff12';toast(soundOn?'الصوت مفعّل':'الصوت متوقف')};
document.querySelector('#contrast').onclick=()=>document.body.classList.toggle('high');
document.querySelector('#motion').onclick=()=>{reduceMotion=!reduceMotion;toast(reduceMotion?'تقليل الحركة مفعّل':'تقليل الحركة متوقف')};
async function demo(){if(playing){stopDemo();return}if(reduceMotion){toast('العروض الآلية متوقفة بسبب تقليل الحركة');return}playing=true;controls.enabled=false;document.querySelector('#play').textContent='Ⅱ';const cap=document.querySelector('#caption');const shots=[{p:[0,7.4,8.4],t:[0,.3,0],s:'نظرة عامة على الكتاب والدرس.'},{p:[3.8,4.3,5.2],t:[2.2,.4,0],s:LESSONS[lessonIndex].sceneDescription},{p:[2.6,2.4,3.4],t:[2.2,.7,0],s:'انقر عناصر الرسم بنفسك لتفعيلها وإكمال ختم الدرس.'}];for(const shot of shots){if(!playing)return;cap.textContent=shot.s;cap.style.opacity=1;await new Promise(resolve=>gsap.to(camera.position,{x:shot.p[0],y:shot.p[1],z:shot.p[2],duration:1.25,ease:'power2.inOut',onComplete:resolve}));if(!playing)return;await new Promise(resolve=>gsap.to(controls.target,{x:shot.t[0],y:shot.t[1],z:shot.t[2],duration:.8,ease:'power2.inOut',onComplete:resolve}));await new Promise(r=>setTimeout(r,1250));}stopDemo();document.querySelector('#reset').click()}
document.querySelector('#play').onclick=demo;
addEventListener('keydown',e=>{if(e.key==='ArrowRight')turn(-1);if(e.key==='ArrowLeft')turn(1);if(e.key==='Escape')document.querySelector('#toc').classList.remove('open')});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);labelRenderer.setSize(innerWidth,innerHeight)});
renderLesson();
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);labelRenderer.render(scene,camera)}animate();
</script></body></html>
